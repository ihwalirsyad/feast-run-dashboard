<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEAST RUN Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #f3eee5; color: #292521;
      font-family: Arial, sans-serif; padding: 20px;
    }
    .panel {
      width: 100%; max-width: 390px;
      background: #fff; padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { margin: 0 0 8px; color: #a52d2d; }
    p { color: #777; }
    input, button {
      width: 100%; padding: 13px;
      margin-top: 12px; border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #ddd; }
    button {
      border: 0; background: #a52d2d;
      color: white; font-weight: bold;
    }
    #message { font-size: 14px; margin-top: 15px; }
    #dashboard { display: none; }
  </style>
</head>
<body>
  <div class="panel" id="login">
    <h1>FEAST RUN</h1>
    <p>Dashboard administrasi dan pembayaran</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="loginUser()">LOGIN</button>
    <div id="message"></div>
  </div>

  <div class="panel" id="dashboard">
    <h1>FEAST RUN</h1>
    <p id="welcome"></p>
    <p id="role"></p>
    <p>Login berhasil. Koneksi database aktif.</p>
    <button onclick="logoutUser()">LOGOUT</button>
  </div>

  <script>
    const SUPABASE_URL = "https://zmubmnprzohtxxzukacg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_uYcFb90dqa8NJIUE70TAZg_11h9bBlg";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loginUser() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "Memeriksa akun...";

      const { data, error } = await db.auth.signInWithPassword({
        email, password
      });

      if (error) {
        message.textContent = "Login gagal: " + error.message;
        return;
      }

      await showDashboard(data.user);
    }

    async function showDashboard(user) {
      const { data: profile, error } = await db
        .from("profiles")
        .select("full_name, role")
        .eq("id", user.id)
        .single();

      if (error || !profile || !["admin", "petugas"].includes(profile.role)) {
        await db.auth.signOut();
        document.getElementById("message").textContent =
          "Akun belum memiliki akses. Hubungi admin.";
        return;
      }

      document.getElementById("login").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      document.getElementById("welcome").textContent =
        "Halo, " + profile.full_name;
      document.getElementById("role").textContent =
        "Role: " + profile.role;
    }

    async function logoutUser() {
      await db.auth.signOut();
      location.reload();
    }

    db.auth.getSession().then(({ data }) => {
      if (data.session) showDashboard(data.session.user);
    });
  </script>
</body>
</html>
